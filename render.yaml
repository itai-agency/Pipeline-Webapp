# Render Blueprint — API backend (Opción A)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pipeline-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build:api
    startCommand: NODE_ENV=production node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_API_VERSION
        value: v21.0
      - key: KOMMO_SUBDOMAIN
        sync: false
      - key: KOMMO_ACCESS_TOKEN
        sync: false
      - key: KOMMO_CLIENT_MAP
        value: "{}"
      - key: KOMMO_STATUS_MAP
        value: "{}"
      - key: SYNC_API_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
